name: CI/CD Frontend StudySpot

on:
  push:
    branches:
      - main
      - test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Docker Hub login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag based on branch
        run: |
          if [ "${GITHUB_REF_NAME}" == "main" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=test" >> $GITHUB_ENV
          fi

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/studyspot-frontend:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/studyspot-frontend:${{ env.IMAGE_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          run: |
            IMAGE_TAG=${{ env.IMAGE_TAG }}
            echo "Deploying branch with IMAGE_TAG=$IMAGE_TAG"
            cd ~/studyspot
            if [ "$IMAGE_TAG" = "test" ]; then
              SERVICE_NAME="frontend-test"
            else
              SERVICE_NAME="frontend"
            fi
            docker compose pull $SERVICE_NAME
            docker compose up -d $SERVICE_NAME